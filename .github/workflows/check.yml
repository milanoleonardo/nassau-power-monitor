name: check-power

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email instead of running a check"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check-power
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Send a test email
        if: ${{ inputs.test_email }}
        run: python3 notify.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}

      - name: Trace the router from Globalping probes
        if: ${{ !inputs.test_email }}
        run: python3 check.py
        env:
          TARGETS: ${{ secrets.TARGETS }}
          GLOBALPING_TOKEN: ${{ secrets.GLOBALPING_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}

      - name: Commit the result
        if: ${{ !inputs.test_email }}
        run: |
          git config user.name "power-monitor[bot]"
          git config user.email "power-monitor@users.noreply.github.com"
          git add docs/log.csv docs/status.json
          git diff --cached --quiet && exit 0
          state=$(python3 -c 'import json; print(json.load(open("docs/status.json"))["state"])')
          git commit -q -m "check: $state"
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase; sleep 3; done
          exit 1
